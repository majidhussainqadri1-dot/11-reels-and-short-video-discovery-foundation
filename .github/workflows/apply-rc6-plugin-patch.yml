name: Apply File 11 RC6 Plugin Patch
on:
  push:
    branches:
      - codex/file-11-40-review-v1.1.0-rc6
    paths:
      - '.bootstrap/rc6-plugin.patch.gz.b64'
      - '.github/workflows/apply-rc6-plugin-patch.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[rc6-plugin-applied]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/file-11-40-review-v1.1.0-rc6
          fetch-depth: 0
      - name: Decode and verify patch
        run: |
          base64 -d .bootstrap/rc6-plugin.patch.gz.b64 > /tmp/rc6.patch.gz
          echo "d11476dec908391fb07db842f76c5eb5ce7e1736ce4905b2cc2a943650b99ef1  /tmp/rc6.patch.gz" | sha256sum -c -
          gzip -dc /tmp/rc6.patch.gz > /tmp/rc6.patch
          git apply --check /tmp/rc6.patch
          git apply /tmp/rc6.patch
      - name: Basic exact-source verification
        run: |
          find 11-reels-foundation -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check 11-reels-foundation/assets/js/rsv.js
          node --check 11-reels-foundation/assets/js/rsv-top20.js
          grep -q "1.1.0-rc6" 11-reels-foundation/11-reels-foundation.php
          grep -q "RSV_CONTRACT_VERSION', 5" 11-reels-foundation/11-reels-foundation.php
          grep -q "EVENT_VERSION = 4" 11-reels-foundation/includes/class-rsv-contracts.php
          grep -q "SCHEMA_VERSION = '1.1.0'" 11-reels-foundation/includes/class-rsv-top20.php
      - name: Commit applied RC6 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .bootstrap/rc6-plugin.patch.gz.b64
          git rm .github/workflows/apply-rc6-plugin-patch.yml
          git add 11-reels-foundation
          git commit -m "Apply File 11 RC6 forty-review corrections [rc6-plugin-applied]"
          git push origin HEAD:codex/file-11-40-review-v1.1.0-rc6
