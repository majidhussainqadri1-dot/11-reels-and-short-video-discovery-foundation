name: File 11 Future30 1.2.0-rc21 Release QA
on:
  push:
    branches:
      - 'codex/**'
      - 'fix/**'
      - 'main'
      - 'audit/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: file11-future30-rc21-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  source-package-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install archive tools
        run: sudo apt-get update && sudo apt-get install -y zip unzip
      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: Complete suite on PHP 8.1
        run: bash ./tests/run-all.sh
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Complete suite on PHP 8.3
        run: bash ./tests/run-all.sh
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Complete suite on PHP 8.4
        run: bash ./tests/run-all.sh
      - name: Build canonical Future30 rc21 package
        run: bash ./tools/build-package.sh packages/reels-foundation-11-1.2.0-rc21.zip
      - name: Verify checksum, archive and source parity
        run: |
          cd packages
          sha256sum --check reels-foundation-11-1.2.0-rc21.zip.sha256
          unzip -t reels-foundation-11-1.2.0-rc21.zip
          cd ..
          rm -rf /tmp/rsv-future30-rc21 && mkdir -p /tmp/rsv-future30-rc21
          unzip -q packages/reels-foundation-11-1.2.0-rc21.zip -d /tmp/rsv-future30-rc21
          diff -ru 11-reels-foundation /tmp/rsv-future30-rc21/reels-foundation-11
      - name: Publish exact-head Future30 rc21 artifact
        uses: actions/upload-artifact@v4
        with:
          name: file11-reels-1.2.0-rc21
          path: |
            packages/reels-foundation-11-1.2.0-rc21.zip
            packages/reels-foundation-11-1.2.0-rc21.zip.sha256
