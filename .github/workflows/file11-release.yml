name: File 11 Release QA
on:
  push:
    branches: ['codex/**','fix/**','main']
  pull_request:
permissions:
  contents: read
concurrency:
  group: file11-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-package-qa:
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1','8.3','8.4']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Install archive tools
        run: sudo apt-get update && sudo apt-get install -y zip unzip
      - name: Run complete automated suite
        run: bash ./tests/run-all.sh
      - name: Build canonical package
        run: bash ./tools/build-package.sh packages/reels-foundation-11-1.0.0-rc3.zip
      - name: Verify checksum and archive
        run: |
          cd packages
          sha256sum --check reels-foundation-11-1.0.0-rc3.zip.sha256
          unzip -t reels-foundation-11-1.0.0-rc3.zip
      - name: Verify package/source parity
        run: |
          rm -rf /tmp/rsv-extract
          mkdir -p /tmp/rsv-extract
          unzip -q packages/reels-foundation-11-1.0.0-rc3.zip -d /tmp/rsv-extract
          diff -ru 11-reels-foundation /tmp/rsv-extract/reels-foundation-11
      - name: Publish release-candidate artifact
        if: matrix.php == '8.3'
        uses: actions/upload-artifact@v4
        with:
          name: file11-reels-1.0.0-rc3
          path: |
            packages/reels-foundation-11-1.0.0-rc3.zip
            packages/reels-foundation-11-1.0.0-rc3.zip.sha256
