name: Baseline Integrity

on:
  push:
    branches:
      - baseline/**
  pull_request:

permissions:
  contents: read

jobs:
  baseline-integrity:
    if: startsWith(github.ref_name, 'baseline/') || startsWith(github.head_ref, 'baseline/')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify exact original source inventory
        shell: bash
        run: |
          set -euo pipefail
          LC_ALL=C sort SOURCE-FILES.txt -o expected-files.txt
          LC_ALL=C find reels -type f -print | sort > actual-files.txt
          diff -u expected-files.txt actual-files.txt
          test "$(wc -l < actual-files.txt)" -eq 6

      - name: Reject symbolic links in source
        run: test -z "$(find reels -type l -print -quit)"

      - name: Verify original SHA-256 checksums
        run: sha256sum --check CHECKSUMS.sha256

      - name: Verify PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find reels -type f -name '*.php' -print0)

      - name: Verify JavaScript syntax
        run: node --check reels/assets/reels.js

      - name: Verify original baseline identity markers
        shell: bash
        run: |
          grep -Fq 'Plugin Name: Reels and Short Video Discovery Foundation' reels/reels.php
          grep -Fq 'Version: 0.1.0' reels/reels.php
          grep -Fq "define('SRL_VERSION','0.1.0')" reels/reels.php
          grep -Fq 'Stable tag: 0.1.0' reels/readme.txt
