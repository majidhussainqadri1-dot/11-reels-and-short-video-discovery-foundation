name: File 11 RC2 Bootstrap

on:
  push:
    branches:
      - codex/file-11-complete-master-plan-v1.0-rc2

permissions:
  contents: write

jobs:
  reconstruct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble diagnostic archive
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .bootstrap/rc2part00 .bootstrap/rc2part01 \
            .bootstrap/rc2part02 .bootstrap/rc2part03 \
            .bootstrap/rc2part04 .bootstrap/rc2part05 \
            .bootstrap/rc2part06 .bootstrap/rc2part07 \
            .bootstrap/rc2part08 .bootstrap/rc2part09 \
            .bootstrap/rc2part10a .bootstrap/rc2part10b \
            .bootstrap/rc2part11 > /tmp/file11rc2-source.b64
          base64 -d /tmp/file11rc2-source.b64 > /tmp/file11rc2-source.tar.gz
          sha256sum /tmp/file11rc2-source.b64 /tmp/file11rc2-source.tar.gz
          cp /tmp/file11rc2-source.b64 current-file11rc2-source.b64
          cp /tmp/file11rc2-source.tar.gz current-file11rc2-source.tar.gz

      - name: Upload diagnostic archive
        uses: actions/upload-artifact@v4
        with:
          name: file11-rc2-bootstrap-diagnostic
          path: |
            current-file11rc2-source.b64
            current-file11rc2-source.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Reconstruct and verify canonical RC2 tree
        shell: bash
        run: |
          set -euo pipefail
          echo "3cc0001b8b059d4c70230197cfb335b2beeafaec851caf6c7b075a8445e3bbf5  /tmp/file11rc2-source.tar.gz" | sha256sum -c -
          tar -xzf /tmp/file11rc2-source.tar.gz

          rm -rf reels
          rm -f .github/workflows/baseline-integrity.yml
          rm -f .github/workflows/corrective-qa.yml
          rm -rf .bootstrap
          rm -f .github/workflows/rc2-bootstrap.yml

          bash ./tests/run-all.sh

      - name: Commit reconstructed RC2 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete File 11 RC2 forensic correction and release evidence"
          git push origin HEAD:codex/file-11-complete-master-plan-v1.0-rc2
