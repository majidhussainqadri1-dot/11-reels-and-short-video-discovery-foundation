name: Apply File 11 RC5 Corrective Payload
on:
  push:
    branches:
      - 'codex/file-11-four-plan-complete-v1.1.0-rc5'
permissions:
  contents: write
concurrency:
  group: apply-file11-rc5
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/file-11-four-plan-complete-v1.1.0-rc5
          fetch-depth: 0
      - name: Verify and apply corrective payload
        shell: bash
        run: |
          set -euo pipefail
          count="$(find .github -maxdepth 1 -type f -name 'rc5-payload.part-*' | wc -l)"
          if [ "$count" -eq 0 ]; then
            echo "RC5 payload already applied."
            exit 0
          fi
          test "$count" -eq 10
          cp .github/workflows/file11-release.yml /tmp/file11-release.yml
          cat .github/rc5-payload.part-* | base64 -d > /tmp/rc5-payload.tar.xz
          test "$(sha256sum /tmp/rc5-payload.tar.xz | cut -d' ' -f1)" = "84cad2e1da33056dd87eb04b435ba46c2b718ffe05dfe0bde5b94314b3f9f01f"
          tar -xJf /tmp/rc5-payload.tar.xz -C .
          cp /tmp/file11-release.yml .github/workflows/file11-release.yml
          rm -f .github/rc5-payload.part-* .github/rc5-payload.tar.xz.b64
          chmod +x tests/run-all.sh tests/static-contracts.sh tools/build-package.sh
          git config user.name "majidhussainqadri1-dot"
          git config user.email "majidhussainqadri1@gmail.com"
          git add -A
          git commit -m "Apply File 11 RC5 four-plan corrective completion"
          git push origin HEAD:codex/file-11-four-plan-complete-v1.1.0-rc5
